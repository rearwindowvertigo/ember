[project]
name = "ember-app"
version = "0.23.0"
description = "Lets Claude lead AI coding workers on one Linux machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "pyside6-essentials>=6.12.0",
]

[project.scripts]
emb = "ember.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyrefly>=1.4.0",
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ember"]

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ANN", "D"]

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["*Event", "*Hint", "eventFilter", "hitButton", "nextCheckState"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-n", "auto", "--strict-markers"]
qt_api = "pyside6"
tmp_path_retention_count = 1
