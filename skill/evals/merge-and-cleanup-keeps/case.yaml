schema_version: "1.1"
name: merge-and-cleanup-keeps
expected_outcome: |
  The run's commit is correct and complete, and its test run left untracked
  `__pycache__` folders in its worktree. Claude claims the run, starts `emb run`
  with the claim, checks the branch and gives a Keep verdict. It asks no merge
  question and runs `emb merge <branch> --into claude/report-since --verdict
  keep`; the cleanup keeps the worktree and branch. Claude reports the tip and
  the keep without removing anything by force, and finishes the claim last.
context:
  scaffold_script: place-files.sh
