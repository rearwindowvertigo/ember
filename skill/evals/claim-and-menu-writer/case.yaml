schema_version: "1.1"
name: claim-and-menu-writer
expected_outcome: |
  Claude claims the run with `emb choices --claim --id <id>` before any worker
  question, read or start. The claim is `none` and the menu row Single runs
  Writer is `codex:gpt-6.1-sol` at `high`, `set`, so Claude names the row, model
  and effort in one line and asks no worker question. It starts `emb run --engine
  codex` as a background command with `--claim <id>` and `--trailer`, runs
  `scripts/verify_branch.py` on the run's branch and worktree, runs a check of
  its own, gives a Keep verdict (the run's commit is correct and complete),
  merges with `emb merge <branch> --into claude/report-since --verdict keep`, and
  then runs `emb choices --finish <id>`.
context:
  scaffold_script: place-files.sh
