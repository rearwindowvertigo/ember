name: check

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**.md"
      - "*.md"

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install the system libraries Qt loads
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0t64
      - run: uv sync --locked
      - run: make check
