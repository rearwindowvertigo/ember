name: check

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**.md"
      - "*.md"

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A pull request that changes only what a release changes (the
      # changelog, the manifest and the version lines) skips the full check.
      - id: release
        run: >-
          python3 dev/release_only.py
          "origin/${{ github.base_ref }}" HEAD
          --github-output "$GITHUB_OUTPUT"
      - if: steps.release.outputs.release_only != 'true'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - if: steps.release.outputs.release_only != 'true'
        name: Install system dependencies for the checks
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0t64
          fonts-dejavu-core apt-utils
      - if: steps.release.outputs.release_only != 'true'
        run: uv sync --locked
      - if: steps.release.outputs.release_only != 'true'
        run: make check
