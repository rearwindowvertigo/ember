# The software Ember depends on, as `emb deps` and the Dependencies screen
# show it. Each entry says how its installed version and its newest version
# are read, and commands shown for an update (`update` or `methods`) or
# while it is missing (`install`). Ember shows these commands; it runs one only
# after the owner confirms it. `update_note` and `install_note` are shown in
# place of a command that is absent.
# `updater_by_major` overrides install-method commands by installed major version.

[[components]]
id = "codex"
label = "Codex"
group = "apps"
installed = { kind = "command", engine = "codex", pattern = 'codex-cli (\S+)' }
newest = { kind = "json", url = "https://registry.npmjs.org/@openai/codex/latest", field = "version" }
updater = "codex update"
install = "npm install -g @openai/codex"

[[components.methods]]
path = "{prefix}/lib/node_modules/{package}"
update = "npm install -g --prefix {prefix} {package}@latest"

[[components.methods]]
path = "{prefix}/global/*/node_modules/{package}"
update = "pnpm add -g {package}@latest"

[[components.methods]]
path = "{prefix}/install/global/node_modules/{package}"
update = "bun add -g {package}@latest"

[[components.methods]]
path = "{prefix}/Cellar/{formula}"
update = "brew upgrade {formula}"

[[components.methods]]
kind = "dpkg"
update = "sudo apt install --only-upgrade {package}"

[[components]]
id = "opencode"
label = "OpenCode"
group = "apps"
installed = { kind = "command", engine = "opencode", pattern = '^(?:opencode v)?([0-9]+(?:\.[0-9]+)*)$' }
newest = { kind = "github", repo = "anomalyco/opencode" }
updater = "opencode upgrade"
updater_by_major = { "1" = "opencode upgrade --major" }
install = "curl -fsSL https://opencode.ai/v2/install | bash"

[[components.methods]]
path = "{prefix}/lib/node_modules/{package}"
update = "npm install -g --prefix {prefix} {package}@latest"

[[components.methods]]
path = "{prefix}/global/*/node_modules/{package}"
update = "pnpm add -g {package}@latest"

[[components.methods]]
path = "{prefix}/install/global/node_modules/{package}"
update = "bun add -g {package}@latest"

[[components.methods]]
path = "{prefix}/Cellar/{formula}"
update = "brew upgrade {formula}"

[[components.methods]]
path = "~/.opencode/bin/opencode"
update = "{launcher} upgrade"

[[components.methods]]
kind = "dpkg"
update = "sudo apt install --only-upgrade {package}"

[[components]]
id = "claude"
label = "Claude Code"
group = "apps"
installed = { kind = "command", engine = "claude", pattern = '^(\S+) \(Claude Code\)$' }
newest = { kind = "text", url = "https://downloads.claude.ai/claude-code-releases/{channel}", channel = "claude-code" }
updater = "claude update"
install = "curl -fsSL https://claude.ai/install.sh | bash"

[[components.methods]]
path = "{prefix}/lib/node_modules/{package}"
update = "npm install -g --prefix {prefix} {package}@latest"

[[components.methods]]
path = "{prefix}/global/*/node_modules/{package}"
update = "pnpm add -g {package}@latest"

[[components.methods]]
path = "{prefix}/install/global/node_modules/{package}"
update = "bun add -g {package}@latest"

[[components.methods]]
path = "{prefix}/Cellar/{formula}"
update = "brew upgrade {formula}"

[[components.methods]]
path = "~/.local/share/claude/versions/*"
update = "{launcher} update"

[[components.methods]]
kind = "dpkg"
update = "sudo apt install --only-upgrade {package}"

[[components]]
id = "claude-desktop"
label = "Claude Desktop"
group = "apps"
installed = { kind = "apt", package = "claude-desktop" }
newest = { kind = "apt", package = "claude-desktop" }
update = "sudo apt install --only-upgrade claude-desktop"
install_note = "Not installed."

[[components]]
id = "ember-skill"
label = "ember skill"
group = "apps"
installed = { kind = "skill", commands = { missing = "emb skill install", "broken link" = "emb skill install", "other link" = "emb skill install --force" } }
newest = { kind = "none" }

[[components]]
id = "tmux"
label = "tmux"
group = "system"
installed = { kind = "apt", package = "tmux" }
newest = { kind = "apt", package = "tmux" }
update = "sudo apt install --only-upgrade tmux"
install = "sudo apt install tmux"

[[components]]
id = "bubblewrap"
label = "bubblewrap"
group = "system"
installed = { kind = "apt", package = "bubblewrap" }
newest = { kind = "apt", package = "bubblewrap" }
update = "sudo apt install --only-upgrade bubblewrap"
install = "sudo apt install bubblewrap"

[[components]]
id = "git"
label = "git"
group = "system"
installed = { kind = "apt", package = "git" }
newest = { kind = "apt", package = "git" }
update = "sudo apt install --only-upgrade git"
