[[components]]
id = "pyside6"
label = "PySide6"
group = "libraries"
installed = { kind = "python", package = "PySide6-Essentials" }
newest = { kind = "pypi", package = "PySide6-Essentials" }
update_note = "Updates with the next Ember release."
install_note = "Reinstall Ember."
